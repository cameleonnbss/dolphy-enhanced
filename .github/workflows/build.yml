name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Hosted runners ship the SDK; the setup-android action fails on license
      # acceptance, so accept them directly and add the platform if missing.
      - name: Set up Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true

      # The repository ships only gradlew.bat (Windows), so CI uses a real
      # Gradle install instead of the wrapper script.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Translation coverage check
        run: python3 tools/i18n/check_coverage.py --strict

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dolphy-enhanced-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
